name: GUDDisplay
options:
  bundleIdPrefix: com.leftshift
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  GUDDisplay:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        # Space only in the user-visible name; scheme and Swift module stay
        # GUDDisplay so command-line invocations need no quoting.
        PRODUCT_NAME: GUD Display
        PRODUCT_MODULE_NAME: GUDDisplay
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.leftshift.gud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging/GUDDisplay-Bridging-Header.h
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application: Left Shift Logical, LLC (KNBPD99JQM)"
        DEVELOPMENT_TEAM: KNBPD99JQM
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Signing/GUDDisplay.entitlements
      configs:
        # Xcode injects get-task-allow into the base entitlements; harmless in
        # Debug (it is what lets a debugger attach) but notarization rejects
        # any binary that requests it, so Release signs the file as-is.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # Plain builds need an explicit secure timestamp for notarization.
          OTHER_CODE_SIGN_FLAGS: "$(inherited) --timestamp"
    info:
      path: Support/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: GUD Display
        CFBundleDisplayName: GUD Display
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        SUFeedURL: https://raw.githubusercontent.com/fcjr/gud-display-mac/main/appcast.xml
        SUPublicEDKey: k5bdeSR+q4Ed20LCWImOLLT6vthdxYz6SQ8KJJ6c3HU=
        SUEnableAutomaticChecks: true
    dependencies:
      - sdk: IOUSBHost.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: IOKit.framework
      - package: Sparkle
    scheme:
      testTargets:
        - GUDDisplayTests
  GUDDisplayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: GUDDisplay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Tests/Tests-Bridging-Header.h
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GUD Display.app/Contents/MacOS/GUD Display
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application: Left Shift Logical, LLC (KNBPD99JQM)"
        DEVELOPMENT_TEAM: KNBPD99JQM
